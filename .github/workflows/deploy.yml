name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd ~/Data_pipeline

            # Pull latest code (force match GitHub)
            git fetch origin main
            git reset --hard origin/main

            # Create .env for docker-compose (root level)
            printf 'NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}\n' > .env

            # Rebuild and restart containers
            docker compose build --no-cache
            docker compose up -d

            # Make sure every service came up before cleaning. `prune --volumes` deletes
            # volumes not used by a running container — incl. Redis's BullMQ queue data —
            # so never prune while a service is down.
            sleep 15
            expected=$(docker compose config --services | sort)
            running=$(docker compose ps --status running --services | sort)
            if [ "$running" != "$expected" ]; then
              echo "Not all services are running — skipping Docker cleanup."
              echo "Expected: $(echo $expected)"
              echo "Running:  $(echo $running)"
              exit 1
            fi

            # Free disk: stopped containers, unused networks/images/volumes and build cache
            echo "Disk before cleanup: $(df -h / | awk 'NR==2 {print $4 " free of " $2}')"
            docker system prune -a -f --volumes
            echo "Disk after cleanup:  $(df -h / | awk 'NR==2 {print $4 " free of " $2}')"

            echo "Deploy complete!"
